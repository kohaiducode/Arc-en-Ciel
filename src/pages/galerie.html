<section class="section">
    <div class="container">
        <h1 class="section-title">{{page.title}}</h1>
        
        <div class="gallery-filters">
            <button class="filter-btn active" data-filter="all">Tout</button>
            <button class="filter-btn" data-filter="chambres">Chambres</button>
            <button class="filter-btn" data-filter="services">Services</button>
            <button class="filter-btn" data-filter="exterieur">Extérieur</button>
        </div>

        <div class="gallery-grid" id="galleryGrid">
            <div class="gallery-item" data-category="chambres">
                <img src="{{base_path}}/assets/images/room-standard.webp" alt="Chambre Standard" loading="lazy">
            </div>
            <div class="gallery-item" data-category="chambres">
                <img src="{{base_path}}/assets/images/room-superior.webp" alt="Chambre Supérieure" loading="lazy">
            </div>
            <div class="gallery-item" data-category="chambres">
                <img src="{{base_path}}/assets/images/suite-family.webp" alt="Suite Familiale" loading="lazy">
            </div>
            <div class="gallery-item" data-category="services">
                <img src="{{base_path}}/assets/images/restaurant.webp" alt="Restaurant" loading="lazy">
            </div>
            <div class="gallery-item" data-category="services">
                <img src="{{base_path}}/assets/images/spa.webp" alt="Spa" loading="lazy">
            </div>
            <!-- Ajouter d'autres images ici -->
        </div>
    </div>
</section>
