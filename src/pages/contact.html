<section class="section">
    <div class="container">
        <h1 class="section-title">{{page.title}}</h1>
        
        <div class="grid-2">
            <div>
                <h2 style="color: var(--accent);">Envoyez-nous un message</h2>
                <form id="contactForm" class="contact-form">
                    <!-- Remplacer la clé Web3Forms par une vraie clé -->
                    <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
                    
                    <div class="form-group">
                        <label for="name">{{page.form_name}}</label>
                        <input type="text" id="name" name="name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="email">{{page.form_email}}</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="message">{{page.form_message}}</label>
                        <textarea id="message" name="message" class="form-control" required></textarea>
                    </div>
                    
                    <button type="submit" class="btn-primary" id="submitBtn">{{page.form_submit}}</button>
                    <p id="formResult" style="margin-top: 10px; display: none;"></p>
                </form>
            </div>
            
            <div>
                <h2 style="color: var(--accent);">Nos Coordonnées</h2>
                <p><strong>Adresse :</strong> {{global.address}}</p>
                <p><strong>Téléphone :</strong> <a href="tel:{{global.phone}}">{{global.phone}}</a></p>
                <p><strong>Email :</strong> <a href="mailto:{{global.email}}">{{global.email}}</a></p>
                
                <div style="margin-top: var(--space-lg); border-radius: 8px; overflow: hidden; box-shadow: var(--shadow-sm);">
                    <!-- Placeholder map -->
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2624.9916256937595!2d2.292292615674403!3d48.85837007928746!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47e66e2964e34e2d%3A0x8ddca9ee380ef7e0!2sTour%20Eiffel!5e0!3m2!1sfr!2sfr!4v1628172935272!5m2!1sfr!2sfr" 
                        width="100%" 
                        height="300" 
                        style="border:0;" 
                        allowfullscreen="" 
                        loading="lazy">
                    </iframe>
                </div>
            </div>
        </div>
    </div>
</section>
