<section class="section">
    <div class="container">
        <h1 class="section-title">{{page.title}}</h1>
        <p style="text-align: center; max-width: 800px; margin: 0 auto var(--space-xl) auto; font-size: 1.2rem;">
            {{page.intro}}
        </p>

        <h2 class="section-title">{{page.access_title}}</h2>
        <div class="grid-2" style="margin-bottom: var(--space-2xl);">
            {{access_modes_html}}
        </div>

        <h2 class="section-title">{{page.tourism_title}}</h2>
        <div class="grid-3" style="margin-bottom: var(--space-2xl);">
            {{attractions_html}}
        </div>

        <div style="text-align: center; margin-top: var(--space-xl);">
            <a href="https://www.eze-tourisme.com/" class="btn-primary" target="_blank" rel="noopener">Visiter le site de l'Office de Tourisme</a>
        </div>
    </div>
</section>
