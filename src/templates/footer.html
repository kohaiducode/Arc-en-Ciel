<footer class="site-footer">
    <div class="container">
        <div class="footer-content grid-2">
            <div>
                <img src="{{base_path}}/assets/images/logo.webp" alt="Arc en Ciel" style="max-height: 60px; margin-bottom: var(--space-sm);">
                <h4>{{global.hotel_name}}</h4>
                <p>{{global.address}}</p>
            </div>
            <div>
                <h4>Contact</h4>
                <p>Tel: {{global.phone}}</p>
                <p>Email: {{global.email}}</p>
            </div>
        </div>
        <div class="copyright">
            <p>&copy; 2026 {{global.hotel_name}}. Tous droits réservés.</p>
        </div>
    </div>
</footer>
