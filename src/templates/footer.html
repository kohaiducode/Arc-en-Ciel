<footer class="site-footer">
    <div class="container">
        <div class="footer-content grid-3">
            <div>
                <h4>{{global.hotel_name}}</h4>
                <p>{{global.address}}</p>
            </div>
            <div>
                <h4>Contact</h4>
                <p>Tel: {{global.phone}}</p>
                <p>Email: {{global.email}}</p>
            </div>
            <div>
                <h4>Suivez-nous</h4>
                <div class="social-links">
                    <a href="{{global.socials.instagram}}" target="_blank" rel="noopener">Instagram</a>
                    <a href="{{global.socials.facebook}}" target="_blank" rel="noopener">Facebook</a>
                </div>
            </div>
        </div>
        <div class="copyright">
            <p>&copy; 2026 {{global.hotel_name}}. Tous droits réservés.</p>
        </div>
    </div>
</footer>
