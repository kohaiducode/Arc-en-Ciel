<header class="site-header">
    <div class="container">
        <div class="logo">
            <a href="{{base_path}}/{{lang}}/"><img src="{{base_path}}/assets/images/logo.webp" alt="Arc en Ciel" style="max-height: 50px;"></a>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="{{base_path}}/{{lang}}/">Accueil</a></li>
                <li><a href="{{base_path}}/{{lang}}/chambres/">Chambres</a></li>
                <li><a href="{{base_path}}/{{lang}}/services/">Services</a></li>
                <li><a href="{{base_path}}/{{lang}}/galerie/">Galerie</a></li>
                <li><a href="{{base_path}}/{{lang}}/acces/">Accès & Tourisme</a></li>
                <li><a href="{{base_path}}/{{lang}}/contact/">Contact</a></li>
                <!-- Mobile only contact info inside menu -->
                <li class="mobile-contact">
                    <a href="tel:{{global.phone}}" style="font-size:1.1rem; color: var(--primary);">📞 {{global.phone}}</a>
                    <a href="mailto:{{global.email}}" style="font-size:1.1rem; color: var(--primary);">✉️ {{global.email}}</a>
                    <span style="font-size:0.9rem; margin-top:10px;">📍 {{global.address}}</span>
                </li>
            </ul>
        </nav>
        <div class="header-actions">
            <div class="lang-switcher">
                <a href="{{base_path}}/fr/">FR</a> | <a href="{{base_path}}/en/">EN</a>
            </div>
            <a href="{{base_path}}/{{lang}}/contact/" class="btn-primary">Réserver</a>
            <button class="mobile-menu-toggle" aria-label="Menu" aria-expanded="false">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
        </div>
    </div>
</header>
